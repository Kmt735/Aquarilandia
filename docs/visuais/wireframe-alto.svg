ans, Arial, sans-serif" font-size="18" fill="#0f2a6b" font-weight="400">orientação para cuidar do aquário.</text><text x="52" y="1192.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#475569" font-weight="400">Reconstrução atual · 23/11/2026 · Conteúdo ilustrativo; não representa estoque ou preços reais.</text></svg>