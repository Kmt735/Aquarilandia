ound"/><circle cx="987" cy="269" r="2.5" fill="#0f2a6b"/><circle cx="1002" cy="269" r="2.5" fill="#0f2a6b"/><path d="M604,292 L1018,292" fill="none" stroke="#dce6f2" stroke-width="2"/><text x="604" y="326" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#64748b" font-weight="400">Início  /  Loja  /  Peixes</text><text x="604" y="370" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" fill="#0f2a6b" font-weight="700">Peixes</text><text x="604" y="402.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#475569" font-weight="400">Conheça a ficha antes de escolher. Confira</text><text x="604" y="426.65" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#475569" font-weight="400">os cuidados de cada espécie.</text><rect x="604" y="466" width="414" height="46" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="622" y="496" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#64748b" font-weight="400">Buscar peixes</text><rect x="604" y="526" width="190" height="44" rx="22" fill="#1d4ed8" stroke="none" stroke-width="1.5"/><text x="626" y="555" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="white" font-weight="700">Filtros</text><rect x="812" y="526" width="206" height="44" rx="22" fill="white" stroke="#94a3b8" stroke-width="1.5"/><text x="831" y="555" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#0f2a6b" font-weight="400">Ordenar</text><rect x="604" y="585" width="142" height="33" rx="16" fill="#eff6ff" stroke="none" stroke-width="1.5"/><text x="616" y="608" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#0f2a6b" font-weight="400">Água doce ×</text><rect x="755" y="585" width="124" height="33" rx="16" fill="#eff6ff" stroke="none" stroke-width="1.5"/><text x="767" y="608" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#0f2a6b" font-weight="400">Iniciante ×</text><rect x="888" y="585" width="130" height="33"