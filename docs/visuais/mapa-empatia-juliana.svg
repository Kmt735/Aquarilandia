<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1030" viewBox="0 0 1100 1030" role="img"><title>Documentação visual da Aquarilândia</title><rect width="100%" height="100%" fill="#f2f5fa"/><text x="48" y="48" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#475569" font-weight="700">AQUARILÂNDIA  /  PERSONA E CONTEXTO</text><text x="48" y="99" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" fill="#0f2a6b" font-weight="700">Mapa de empatia de Juliana</text><text x="48" y="138" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#475569" font-weight="400">38 anos · Analista administrativa · São João del-Rei · Aquário de água doce de cerca de 60 L</text><rect x="48" y="167" width="1004" height="100" rx="16" fill="#163a70" stroke="none" stroke-width="1.5"/><text x="72" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#fbbf24" font-weight="700">NECESSIDADE CENTRAL</text><text x="72" y="235.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="white" font-weight="600">Cuidar do aquário com segurança e consultar a loja antes de sair de casa.</text><rect x="48" y="292" width="490" height="192" rx="16" fill="white" stroke="#dce6f2" stroke-width="1.5"/><text x="70" y="328" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#163a70" font-weight="700">O que vê</text><text x="70" y="360.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">Vitrine da Aquarilândia; Instagram no</text><text x="70" y="386.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">cotidiano; vídeos de aquarismo no YouTube;</text><text x="70" y="412.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">o aquário na sala.</text><text x="70" y="460" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#64748b" font-weight="400">Base: descrição fornecida.</text><rect x="562" y="292" width="490" height="192" rx="16" fill="white" stroke="#dce6f2" stroke-width="1.5"/><text x="584" y="328" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#163a70" font-weight="700">O que ouve</text><text x="584" y="360.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">Orientações da proprietária da loja, em</text><text x="584" y="386.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">quem confia para escolher e cuidar dos</text><text x="584" y="412.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">peixes.</text><text x="584" y="460" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#64748b" font-weight="400">Base: descrição fornecida.</text><rect x="48" y="505" width="490" height="192" rx="16" fill="white" stroke="#dce6f2" stroke-width="1.5"/><text x="70" y="541" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#163a70" font-weight="700">O que faz</text><text x="70" y="573.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">Volta à loja mensalmente; compra peixes;</text><text x="70" y="599.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">procura explicações em vídeos; consulta a</text><text x="70" y="625.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">loja quando tem dúvidas.</text><text x="70" y="673" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#64748b" font-weight="400">Base: descrição fornecida.</text><rect x="562" y="505" width="490" height="192" rx="16" fill="white" stroke="#dce6f2" stroke-width="1.5"/><text x="584" y="541" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#163a70" font-weight="700">O que pensa e sente</text><text x="584" y="573.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">Busca relaxamento e autonomia. A perda de</text><text x="584" y="599.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">peixes pode gerar insegurança e receio de</text><text x="584" y="625.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">repetir erros.</text><text x="584" y="673" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#64748b" font-weight="400">Insegurança e receio: inferências.</text><rect x="48" y="718" width="490" height="192" rx="16" fill="white" stroke="#dce6f2" stroke-width="1.5"/><text x="70" y="754" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#163a70" font-weight="700">Dores e obstáculos</text><text x="70" y="786.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">Já perdeu peixes sem entender o motivo;</text><text x="70" y="812.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">não compreende ciclagem e pH; nem sempre</text><text x="70" y="838.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">tem tempo de ir à loja.</text><text x="70" y="886" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#64748b" font-weight="400">Base: descrição fornecida.</text><rect x="562" y="718" width="490" height="192" rx="16" fill="white" stroke="#dce6f2" stroke-width="1.5"/><text x="584" y="754" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#163a70" font-weight="700">Ganhos desejados</text><text x="584" y="786.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">Peixes saudáveis; orientação confiável;</text><text x="584" y="812.1" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">segurança nos cuidados; catálogo acessível</text><text x="584" y="838.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">pelo celular antes da visita.</text><text x="584" y="886" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#64748b" font-weight="400">Base: descrição fornecida.</text><text x="48" y="976.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#475569" font-weight="400">Elaborado a partir da persona fornecida pela equipe. Pensamentos e emoções inferidos não são falas de uma</text><text x="48" y="997.75" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#475569" font-weight="400">entrevista.</text></svg>